  <script>
    tailwind.config = {

  <style>
    /* 自訂流暢動畫與手帳紙感背景 */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

      animation: floatSlow 3.2s ease-in-out infinite;

      animation: fadeSlideUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;

</head>
<body class="min-h-screen bg-[#FAF7F2] text-slate-800 dark:bg-slate-950 dark:text-slate-100 dot-grid-bg antialiased selection:bg-amber-200 selection:text-slate-900">
  <!-- 主容器 -->
  <div id="app" class="min-h-screen flex flex-col justify-between max-w-3xl mx-auto px-4 py-6 sm:px-6 sm:py-10">
    <!-- 頂部導覽列 -->

      <button
        type="button"

    </header>

    <!-- 動態主內容區 -->

      <!-- 由 JavaScript 動態渲染首頁、作答頁與結果頁 -->

    <!-- 底部說明 -->

    const RESULTS = {

        pillClass: 'bg-amber-100 text-amber-900 dark:bg-amber-900/60 dark:text-amber-200',
        diagnosis:

      },
      hedonist: {

        badge: '結果類型二',
        title: '及時行樂享樂怪',
        srlTag: '對應 SRL 表現階段意志控制困難',
        character: '懶懶熊',
        icon: '🛡️',
        accentClass: 'from-sky-500/15 via-cyan-500/10 to-indigo-500/10 border-sky-300/80 dark:border-sky-700/70',
        pillClass: 'bg-sky-100 text-sky-900 dark:bg-sky-900/60 dark:text-sky-200',
        diagnosis:
          '你的專注力容易被外界誘惑（手機、遊戲）拉走，缺乏意志控制。你活在當下，覺得讀書太痛苦，總是把希望寄託在「明天」。',
        strategyTitle: '「視覺化監控」+「環境控制」',
        tips: [
          '讀書時把手機放到另一個房間，或交給爸媽保管。',
          '使用番茄鐘或網頁監控工具（例如 Forest App），讓你的「專注時間」視覺化。每堅持一小段時間，就給自己一點小小的娛樂獎勵。',
        ],
        actionPrompt: '現在就把手機放進抽屜或另一個房間，開啟 25 分鐘專注計時，結束後再給自己小獎勵。',
      },
      escape: {
        id: 'escape',
        badge: '結果類型三',
        title: '自我放棄逃避怪',
        srlTag: '對應自我效能感低落',
        character: '悲傷蛙',
        icon: '🏳️',
        accentClass: 'from-slate-400/20 via-zinc-400/10 to-teal-500/10 border-slate-300/90 dark:border-slate-700',
        pillClass: 'bg-slate-200 text-slate-800 dark:bg-slate-800 dark:text-slate-200',
        diagnosis:

        strategyTitle: '「尋求替代經驗」+「關注微小進步」',
        tips: [

      },
      action: {
        id: 'action',
        badge: '結果類型四',
        title: '行動派潛力股',
        srlTag: 'SRL 高手',
        character: '穩健進化的自我學習者',
        icon: '🌟',
        accentClass: 'from-emerald-500/15 via-teal-500/10 to-lime-500/10 border-emerald-300/80 dark:border-emerald-700/70',
        pillClass: 'bg-emerald-100 text-emerald-900 dark:bg-emerald-900/60 dark:text-emerald-200',
        diagnosis:
          '恭喜你！你已經具備了 SRL 的基礎能力。你懂得將大目標拆解，也能在一定程度上控制自己不滑手機。你是自己的學習主人！',
        strategyTitle: '「自我反思與調整」',
        tips: [
          '繼續保持微目標拆解的習慣。',
          '在讀書計畫中加入「休息」與「反思」的時間，檢討今天的效率，並為明天的狀況做微調。',
        ],
        actionPrompt: '今天結束前花 3 分鐘寫下：哪個方法最有效？明天哪裡可以微調得更輕鬆？',
      },
    };

    // =========================================================================
    // 2. 測驗狀態與互動邏輯
    // =========================================================================
    const state = {
      screen: 'intro', // 'intro' | 'quiz' | 'result'
      currentIndex: 0,
      answers: {},
    };

    let toastTimer = null;

    function showToast(message) {
      const toast = document.getElementById('toast-box');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
      }, 2600);
    }

    function startQuiz() {
      state.screen = 'quiz';
      state.currentIndex = 0;
      state.answers = {};
      render();
    }

    function resetQuiz() {
      state.screen = 'intro';
      state.currentIndex = 0;
      state.answers = {};
      render();
    }

    function selectOption(questionId, optionKey) {
      state.answers[questionId] = optionKey;
      render();

      window.setTimeout(() => {
        if (state.currentIndex < QUESTIONS.length - 1) {
          state.currentIndex += 1;
          render();
        } else {
          state.screen = 'result';
          render();
        }
      }, 220);
    }

    function goPrevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        render();
      } else {
        state.screen = 'intro';
        render();
      }
    }

    function calculateResult() {
      const totals = {
        perfectionist: 0,
        hedonist: 0,
        escape: 0,
        action: 0,
      };

      for (const q of QUESTIONS) {
        const chosenKey = state.answers[q.id];
        const option = q.options.find((opt) => opt.key === chosenKey);
        if (option && option.scores) {
          for (const [typeKey, pts] of Object.entries(option.scores)) {
            totals[typeKey] = (totals[typeKey] || 0) + pts;
          }
        }
      }

      const priority = ['action', 'perfectionist', 'hedonist', 'escape'];
      let bestType = 'action';
      let bestScore = -1;

      for (const typeKey of priority) {
        if (totals[typeKey] > bestScore) {
          bestScore = totals[typeKey];
          bestType = typeKey;
        }
      }

      return {
        winner: RESULTS[bestType],
        totals,
      };
    }

    function copyResultSummary() {
      const { winner } = calculateResult();
      const summaryText = [
        `【SRL 學習怪獸測驗結果】${winner.icon} ${winner.title}（${winner.srlTag}）`,
        `代表人物：${winner.character}`,
        `診斷：${winner.diagnosis}`,
        `破關秘籍（${winner.strategyTitle}）：${winner.tips.join(' / ')}`,
      ].join('\n');

      try {
        const textarea = document.createElement('textarea');
        textarea.value = summaryText;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);

        if (ok) {
          showToast('已複製測驗結果與破關秘籍，可直接貼上分享！');
        } else {
          showToast('目前環境無法自動複製，可手動選取文字複製。');
        }
      } catch (err) {
        showToast('複製時發生問題，請手動選取結果文字。');
      }
    }

    // =========================================================================
    // 3. 畫面渲染函式
    // =========================================================================
    function renderIntro() {

            <span>4 道情境題 · 約 1 分鐘完成</span>
          </div>

          <h1 class="text-2xl sm:text-4xl font-black tracking-tight text-slate-900 dark:text-white leading-tight mb-4">

          </h1>

          <p class="text-sm sm:text-base text-slate-600 dark:text-slate-300 leading-relaxed mb-7">

          </p>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
            <div class="rounded-2xl bg-amber-50/80 dark:bg-slate-800/70 p-3.5 border border-amber-200/60 dark:border-slate-700/70">
              <div class="text-2xl mb-1">🏆</div>
              <div class="text-xs font-bold text-slate-800 dark:text-slate-100">完美主義拖延怪</div>
            </div>
            <div class="rounded-2xl bg-sky-50/80 dark:bg-slate-800/70 p-3.5 border border-sky-200/60 dark:border-slate-700/70">
              <div class="text-2xl mb-1">🛡️</div>
              <div class="text-xs font-bold text-slate-800 dark:text-slate-100">及時行樂享樂怪</div>
            </div>
            <div class="rounded-2xl bg-slate-100/80 dark:bg-slate-800/70 p-3.5 border border-slate-200/80 dark:border-slate-700/70">
              <div class="text-2xl mb-1">🏳️</div>
              <div class="text-xs font-bold text-slate-800 dark:text-slate-100">自我放棄逃避怪</div>
            </div>
            <div class="rounded-2xl bg-emerald-50/80 dark:bg-slate-800/70 p-3.5 border border-emerald-200/60 dark:border-slate-700/70">
              <div class="text-2xl mb-1">🌟</div>
              <div class="text-xs font-bold text-slate-800 dark:text-slate-100">行動派潛力股</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
            <button
              type="button"
              onclick="startQuiz()"
              class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-2xl bg-slate-900 dark:bg-amber-400 text-white dark:text-slate-950 font-bold text-base px-8 py-4 shadow-md hover:bg-slate-800 dark:hover:bg-amber-300 transition active:scale-[0.98]"
            >
              <span>開始測驗</span>
              <span aria-hidden="true">→</span>
            </button>
            <span class="text-xs text-slate-500 dark:text-slate-400 text-center sm:text-left">
              依照直覺作答即可，沒有標準答案
            </span>
          </div>
        </section>
      `;
    }

    function renderQuestion() {
      const q = QUESTIONS[state.currentIndex];
      const selectedKey = state.answers[q.id];
      const progressPercent = Math.round(((state.currentIndex + 1) / QUESTIONS.length) * 100);

      const optionsHtml = q.options
        .map((opt) => {
          const isSelected = selectedKey === opt.key;
          return `
            <button
              type="button"
              onclick="selectOption(${q.id}, '${opt.key}')"
              class="w-full text-left rounded-2xl p-4 sm:p-5 border-2 transition-all duration-200 flex items-start gap-3.5 sm:gap-4 active:scale-[0.99] ${
                isSelected
                  ? 'bg-amber-50 dark:bg-amber-950/50 border-amber-500 dark:border-amber-400 shadow-sm'
                  : 'bg-white dark:bg-slate-900 border-slate-200/90 dark:border-slate-800 hover:border-amber-300 dark:hover:border-amber-700 hover:bg-amber-50/30 dark:hover:bg-slate-800/70'
              }"
            >
              <span class="shrink-0 w-9 h-9 rounded-xl flex items-center justify-center font-black text-sm ${
                isSelected
                  ? 'bg-amber-500 text-white dark:bg-amber-400 dark:text-slate-950'
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200'
              }">
                ${opt.key}
              </span>
              <span class="text-2xl leading-none pt-0.5 select-none" aria-hidden="true">${opt.emoji}</span>
              <span class="flex-1 text-sm sm:text-base font-medium text-slate-800 dark:text-slate-100 leading-relaxed">
                ${opt.text}
              </span>
            </button>
          `;
        })
        .join('');

      return `
        <section class="animate-fade-up rounded-3xl bg-white/95 dark:bg-slate-900/95 p-5 sm:p-8 shadow-sm border border-slate-200/80 dark:border-slate-800">
          <!-- 進度條 -->
          <div class="mb-6">
            <div class="flex items-center justify-between text-xs sm:text-sm font-semibold mb-2">
              <span class="text-amber-700 dark:text-amber-300">${q.tag}</span>
              <span class="text-slate-500 dark:text-slate-400">第 ${state.currentIndex + 1} / ${QUESTIONS.length} 題（${progressPercent}%）</span>
            </div>
            <div class="w-full h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
              <div
                class="h-full rounded-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-300"
                style="width: ${progressPercent}%"
              ></div>
            </div>
          </div>

          <!-- 題目 -->
          <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white leading-snug mb-6">
            ${q.question}
          </h2>

          <!-- 選項列表 -->
          <div class="space-y-3 mb-7">
            ${optionsHtml}
          </div>

          <!-- 底部控制 -->
          <div class="flex items-center justify-between pt-2">
            <button
              type="button"
              onclick="goPrevQuestion()"
              class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
            >
              <span>←</span>
              <span>${state.currentIndex === 0 ? '回到說明' : '上一題'}</span>
            </button>

            <span class="text-xs text-slate-400 dark:text-slate-500">
              點選選項即可自動前往下一題
            </span>
          </div>
        </section>
      `;
    }

    function renderResult() {
      const { winner, totals } = calculateResult();

      const tipsHtml = winner.tips
        .map(
          (tip) => `
            <li class="flex items-start gap-3 text-sm sm:text-base text-slate-700 dark:text-slate-200 leading-relaxed">
              <span class="shrink-0 mt-1.5 w-2 h-2 rounded-full bg-amber-500"></span>
              <span>${tip}</span>
            </li>
          `
        )
        .join('');

      const scoreBreakdown = [
        { key: 'perfectionist', label: '完美主義拖延', icon: '🏆', val: totals.perfectionist },
        { key: 'hedonist', label: '及時行樂享樂', icon: '🛡️', val: totals.hedonist },
        { key: 'escape', label: '自我放棄逃避', icon: '🏳️', val: totals.escape },
        { key: 'action', label: '行動派潛力股', icon: '🌟', val: totals.action },
      ]
        .map(
          (item) => `
            <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/70 px-3.5 py-2.5 border border-slate-200/70 dark:border-slate-700/70 flex items-center justify-between">
              <span class="text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-200">${item.icon} ${item.label}</span>
              <span class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white">${item.val} 分</span>
            </div>
          `
        )
        .join('');

      return `
        <section class="animate-fade-up space-y-5">
          <!-- 主結果卡片 -->
          <div class="rounded-3xl bg-gradient-to-br ${winner.accentClass} bg-white/95 dark:bg-slate-900/95 p-6 sm:p-8 shadow-sm border">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <span class="inline-flex items-center gap-1.5 rounded-full px-3.5 py-1 text-xs font-bold ${winner.pillClass}">
                ${winner.badge}
              </span>
              <span class="text-xs font-semibold text-slate-600 dark:text-slate-300 bg-white/80 dark:bg-slate-800/80 px-3 py-1 rounded-full border border-slate-200/70 dark:border-slate-700">
                ${winner.srlTag}
              </span>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-5 mb-6">
              <div class="animate-float w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/80 dark:border-slate-700 flex items-center justify-center text-4xl sm:text-5xl select-none shrink-0">
                ${winner.icon}
              </div>
              <div>
                <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">
                  【${winner.title}】
                </h1>
                <p class="mt-1.5 text-sm sm:text-base font-medium text-slate-700 dark:text-slate-300">
                  代表人物：${winner.character}
                </p>
              </div>
            </div>

            <!-- 你的診斷 -->
            <div class="rounded-2xl bg-white/85 dark:bg-slate-900/85 p-4 sm:p-5 border border-white/80 dark:border-slate-800 mb-5">
              <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">
                你的診斷
              </h2>
              <p class="text-sm sm:text-base text-slate-800 dark:text-slate-100 leading-relaxed">
                ${winner.diagnosis}
              </p>
            </div>

            <!-- 破關秘籍 -->
            <div class="rounded-2xl bg-white/95 dark:bg-slate-900/95 p-4 sm:p-5 border border-amber-200/80 dark:border-amber-800/50">
              <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 dark:bg-amber-900/60 dark:text-amber-200">
                  破關秘籍（SRL 策略）
                </span>
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">
                  ${winner.strategyTitle}
                </h3>
              </div>

              <ul class="space-y-3 mb-4">
                ${tipsHtml}
              </ul>

              <div class="rounded-xl bg-amber-50 dark:bg-amber-950/40 px-4 py-3 text-xs sm:text-sm font-semibold text-amber-950 dark:text-amber-200 border border-amber-200/70 dark:border-amber-800/50">
                💡 今日微行動：${winner.actionPrompt}
              </div>
            </div>
          </div>

          <!-- 四種傾向分布參考 -->
          <div class="rounded-3xl bg-white/90 dark:bg-slate-900/90 p-5 sm:p-6 shadow-sm border border-slate-200/80 dark:border-slate-800">
            <h3 class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-3">
              四種傾向分布參考
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${scoreBreakdown}
            </div>
          </div>

          <!-- 底部操作按鈕 -->
          <div class="flex flex-col sm:flex-row gap-3 pt-1">
            <button
              type="button"
              onclick="copyResultSummary()"
              class="flex-1 inline-flex items-center justify-center gap-2 rounded-2xl bg-slate-900 dark:bg-amber-400 text-white dark:text-slate-950 font-bold text-sm sm:text-base px-6 py-4 shadow-sm hover:bg-slate-800 dark:hover:bg-amber-300 transition active:scale-[0.98]"
            >
              <span>📋</span>
              <span>複製結果與破關秘籍</span>
            </button>
            <button
              type="button"
              onclick="startQuiz()"
              class="flex-1 inline-flex items-center justify-center gap-2 rounded-2xl bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-bold text-sm sm:text-base px-6 py-4 border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition active:scale-[0.98]"
            >
              <span>🔄</span>
              <span>重新測驗一次</span>
            </button>
          </div>
        </section>
      `;
    }

    function render() {
      const main = document.getElementById('main-content');
      if (!main) return;

      try {
        if (state.screen === 'intro') {
          main.innerHTML = renderIntro();
        } else if (state.screen === 'quiz') {
          main.innerHTML = renderQuestion();
        } else if (state.screen === 'result') {
          main.innerHTML = renderResult();
        }
      } catch (err) {
        main.innerHTML = `
          <div class="rounded-3xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 p-6 text-center">
            <p class="font-bold text-rose-800 dark:text-rose-200 mb-3">畫面渲染時發生錯誤，請重新整理或再試一次。</p>
            <button
              type="button"
              onclick="resetQuiz()"
              class="rounded-xl bg-rose-600 text-white px-4 py-2 text-sm font-semibold"
            >
              回到首頁
            </button>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
